version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rescom_postgres
    restart: always
    environment:
      POSTGRES_USER: rescom_admin
      POSTGRES_PASSWORD: rescom_password
      POSTGRES_DB: rescom_db
    ports:
      - "5433:5432"
    volumes:
      - rescom_pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: rescom_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rescom_minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin;
      do sleep 2; done; mc mb --ignore-existing local/rescom-private-storage;
      mc anonymous set none local/rescom-private-storage"

  clamav:
    image: clamav/clamav:stable
    container_name: rescom_clamav
    restart: always
    ports:
      - "3310:3310"
    volumes:
      - rescom_clamav_data:/var/lib/clamav

volumes:
  rescom_pgdata:
  rescom_minio_data:
  rescom_clamav_data:
