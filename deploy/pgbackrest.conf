# pgBackRest repository on Cloudflare R2 (Story 11.2 AC3). Non-secret settings only.
# Endpoint, bucket, keys and the cipher passphrase come from PGBACKREST_* variables in .env.prod.
# Keep a copy of PGBACKREST_REPO1_CIPHER_PASS off the VPS: without it the backups cannot be restored.
[global]
repo1-type=s3
repo1-s3-region=auto
repo1-s3-uri-style=path
repo1-path=/pgbackrest
repo1-retention-full=7
repo1-cipher-type=aes-256-cbc
compress-type=zst
start-fast=y
log-level-console=info
log-level-file=detail

[rescom]
pg1-path=/var/lib/postgresql/data
