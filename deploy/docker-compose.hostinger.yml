# Hostinger VPS Stack for RESCOM (Option 2: Frontend on Vercel)
# Services: Caddy (TLS/reverse proxy), Backend (NestJS), PostgreSQL 15, ClamAV
# Object storage: Cloudflare R2 via STORAGE_* env (no MinIO on the VPS; Story 11.2 B4)
name: rescom

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
      S3_DOMAIN: ${S3_DOMAIN:-s3.rescom.io.vn}
    volumes:
      - ./Caddyfile.hostinger:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend]

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: always
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/apps/backend/src/main"]
    env_file: .env.prod
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      postgres: { condition: service_healthy }
      clamav: { condition: service_healthy }

  postgres:
    # postgres:15-alpine + pgBackRest; WAL every <=5 min and daily full backups go to R2
    # (RPO 15m, B2/B3). Runbook: _bmad-output/implementation-artifacts/11-2-hostinger-evidence/01-wal-backup-runbook.md
    build:
      context: .
      dockerfile: postgres.Dockerfile
    image: rescom-postgres:15.19-pgbackrest
    restart: always
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=rescom archive-push %p
      - -c
      - archive_timeout=300
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      PGBACKREST_PG1_USER: ${POSTGRES_USER:?}
      PGBACKREST_REPO1_S3_ENDPOINT: ${PGBACKREST_REPO1_S3_ENDPOINT:?}
      PGBACKREST_REPO1_S3_BUCKET: ${PGBACKREST_REPO1_S3_BUCKET:?}
      PGBACKREST_REPO1_S3_KEY: ${PGBACKREST_REPO1_S3_KEY:?}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${PGBACKREST_REPO1_S3_KEY_SECRET:?}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 12

  clamav:
    image: clamav/clamav-debian:1.5.4
    restart: always
    environment:
      CLAMD_CONF_StreamMaxLength: 100M
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 360s

volumes:
  pgdata:
  clamav_data:
  caddy_data:
  caddy_config:
