# Internal-testing stack for one VPS (everything in containers, incl. Postgres, MinIO and the
# frontend). Not the AD-23 pilot topology: that is docker-compose.prod.yml. Only Caddy publishes ports.
#   cp deploy/.env.internal.example deploy/.env.internal   # fill every value
#   docker compose -f deploy/docker-compose.internal.yml --env-file deploy/.env.internal up -d --build
name: rescom

x-minio-credentials: &minio-credentials
  MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:?}
  MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:?}

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      S3_DOMAIN: ${S3_DOMAIN:?}
    volumes:
      - ./Caddyfile.internal:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, minio]

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        # IR.1 pilot: real backend only (no MSW), deferred screens hidden at build time.
        NEXT_PUBLIC_API_MOCKING: disabled
        NEXT_PUBLIC_PILOT_BUILD: "true"
    restart: always
    depends_on: [backend]

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: always
    # The image no longer migrates on start (AD-23: the pipeline does). This stack still does.
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/apps/backend/src/main"]
    env_file: .env.internal
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 12

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: always
    command: server /data
    environment:
      <<: *minio-credentials
      MINIO_API_CORS_ALLOW_ORIGIN: https://${APP_DOMAIN:?}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 12

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }
    environment:
      <<: *minio-credentials
      STORAGE_BUCKET: ${STORAGE_BUCKET:?}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set rescom http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "rescom/$${STORAGE_BUCKET}"
        mc anonymous set none "rescom/$${STORAGE_BUCKET}"

  clamav:
    image: clamav/clamav-debian:stable
    restart: always
    environment:
      # clamd's own default (25M) is below the 50 MB upload limit; larger
      # INSTREAM payloads would be refused as an outage (IR.5 C4, DF9).
      CLAMD_CONF_StreamMaxLength: 100M
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      # clamdcheck.sh (shipped in the image) pings clamd on 3310. Loading
      # the signature database takes minutes on a cold volume, hence the
      # long start_period; the backend waits for it (depends_on above).
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 360s

volumes:
  pgdata:
  minio_data:
  clamav_data:
  caddy_data:
  caddy_config:
