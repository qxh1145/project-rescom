<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#f7f9fc;font-family:'Be Vietnam Pro',sans-serif;color:#1e2446}
.scene{position:absolute;inset:0;overflow:hidden;opacity:0}
.cam{position:absolute;left:0;top:0;width:1920px;height:1200px;transform-origin:0 0}
.cam img{display:block;width:1920px;height:1200px}
.disp{font-family:'Fraunces',serif;font-weight:400;letter-spacing:-2px}
.disp em{color:#6f6f6f}
/* hook */
#chat{position:absolute;left:50%;width:980px;margin-left:-490px;top:0}
.bub{position:absolute;left:0;display:flex;gap:18px;align-items:flex-end;width:980px}
.bub.r{flex-direction:row-reverse}
.av{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:20px;color:#1f6b2a;background:#eaf6e8}
.tx{background:#fff;border:1px solid #e1e6ef;border-radius:28px;padding:20px 28px;font-size:30px;font-weight:500;box-shadow:0 6px 20px rgba(30,36,70,.06);max-width:760px}
.bub.r .tx{background:#2b7a33;color:#fff;border-color:#2b7a33}
#hookveil{position:absolute;inset:0;background:#f9fafd}
#hookline{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:150px;line-height:1}
/* captions */
.cap{position:absolute;left:110px;bottom:96px;background:#fff;border-radius:28px;padding:30px 44px;box-shadow:0 24px 60px rgba(30,36,70,.18);font-size:58px;font-weight:800;letter-spacing:-1px;white-space:nowrap}
.cap span{color:#2b7a33}
.cap small{display:block;font-size:26px;font-weight:600;color:#596078;letter-spacing:0;margin-bottom:6px}
#badge{position:absolute;right:90px;top:70px;background:#2b7a33;color:#fff;border-radius:28px;padding:22px 34px 22px 30px;display:flex;align-items:center;gap:20px;box-shadow:0 20px 50px rgba(31,107,42,.35)}
#badge img{width:84px;height:84px}
#badge .l{font-size:22px;font-weight:600;opacity:.85}
#badge .n{font-size:64px;font-weight:800;line-height:1}
#chip{position:absolute;left:0;top:0;background:#fff6d8;color:#7a5200;font-weight:800;font-size:40px;border-radius:999px;padding:12px 26px;box-shadow:0 10px 30px rgba(122,82,0,.25)}
#cursor{position:absolute;left:0;top:0;width:44px;height:44px}
#ring{position:absolute;width:90px;height:90px;border-radius:50%;border:5px solid #2b7a33}
.mascot{position:absolute;transform-origin:50% 100%}
/* outro */
#outbg{position:absolute;inset:0;background:url(assets/hero.png) center 100%/cover;filter:saturate(1.05)}
#outveil{position:absolute;inset:0;background:linear-gradient(#fff 0%,#fff 42%,rgba(255,255,255,.88) 62%,rgba(255,255,255,.5) 100%)}
#outro .stack{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#otag{font-size:118px;line-height:1.02;text-align:center;margin-top:30px}
#osub{font-size:34px;font-weight:600;color:#596078;margin-top:34px}
#ologo{height:96px}
</style></head><body>

<div class="scene" id="s1">
  <div id="chat"></div>
  <div id="hookveil"></div>
  <div id="hookline" class="disp"><div>Cần <em>100</em> câu trả lời?</div></div>
</div>

<div class="scene" id="s2"><div class="cam" id="c2"><img src="assets/hero.png"></div></div>

<div class="scene" id="s3">
  <div class="cam" id="c3"><img src="assets/market.png"></div>
  <div id="ring"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#1e2446" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
  <div id="badge"><img src="assets/points.png"><div><div class="l">Điểm của bạn</div><div class="n" id="bn">0</div></div></div>
  <div id="chip">+12 điểm</div>
  <div class="cap" id="cap3"><small>Khám phá</small>Làm khảo sát. <span>Nhận điểm.</span></div>
</div>

<div class="scene" id="s4">
  <div class="cam" id="c4a"><img src="assets/forms.png"></div>
  <div class="cam" id="c4b"><img src="assets/resp.png"></div>
  <div class="cap" id="cap4"><small>Khảo sát của tôi</small>Dùng điểm. <span>Nhận câu trả lời thật.</span></div>
</div>

<div class="scene" id="s5">
  <div class="cam" id="c5"><img src="assets/leader.png"></div>
  <img class="mascot" id="m5" src="assets/trophy.png" style="width:420px;right:60px;bottom:-20px">
  <div class="cap" id="cap5"><small>Bảng xếp hạng</small>Cả cộng đồng sinh viên <span>cùng góp sức.</span></div>
</div>

<div class="scene" id="outro">
  <div id="outbg"></div><div id="outveil"></div>
  <div class="stack">
    <img id="omas" src="assets/cheer.png" style="width:300px;height:300px">
    <img id="ologo" src="assets/rescom-logo.png">
    <div id="otag" class="disp">Nhận hỗ trợ — <em>đóng góp lại.</em></div>
    <div id="osub">Khảo sát cho sinh viên, bởi sinh viên.</div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
function cam(el,s,tx,ty){el.style.transform=`translate(${tx}px,${ty}px) scale(${s})`}
// focus image point (fx,fy) at screen (sx,sy) with scale s
function camF(el,s,fx,fy,sx=960,sy=540){cam(el,s,sx-s*fx,sy-s*fy)}
function lerpCam(el,a,b,x){const s=lerp(a[0],b[0],x);camF(el,s,lerp(a[1],b[1],x),lerp(a[2],b[2],x),lerp(a[3]??960,b[3]??960,x),lerp(a[4]??540,b[4]??540,x))}
function vis(id,t,a,b,fi=.25,fo=.2){const o=Math.min(p(t,a,a+fi),1-p(t,b-fo,b));$(id).style.opacity=(t<a||t>b)?0:o;return t>=a&&t<=b}
function pop(el,t,a,dur=.45){const x=p(t,a,a+dur);el.style.opacity=cl(x*3);el.style.transform=`scale(${lerp(.6,1,back(x))})`}

// chat bubbles
const MSG=[["Mọi người ơi làm giúp mình khảo sát với ạ 🙏","L"],["Ai rảnh điền form giúp mình với 🥺","H"],["Up up up ⬆️","L"],["Còn thiếu 87 câu trả lời nữa thôi ạ","T"],["Mình xin 2 phút của mọi người 🙏🙏","N"],["Khảo sát cho khoá luận ạ, cảm ơn nhiều!","M"],["Up lần nữa ạ 😭","L"],["Ai làm xong nhắn mình, mình làm lại cho nha","B"],["🙏🙏🙏","H"]];
const chat=$('chat'); const bubs=MSG.map((m,i)=>{const d=document.createElement('div');d.className='bub'+(i%3===1?' r':'');d.innerHTML=`<div class="av">${m[1]}</div><div class="tx">${m[0]}</div>`;chat.appendChild(d);return d});
function layoutChat(t){let y=0;const H=[];bubs.forEach((b,i)=>{H.push(b.offsetHeight)});
  const shown=bubs.map((b,i)=>p(t,.05+i*.17,.05+i*.17+.28));
  // stack from bottom: newest at bottom (y=900)
  let bottom=930; for(let i=bubs.length-1;i>=0;i--){const s=shown[i]; if(s<=0){bubs[i].style.opacity=0;continue}
    const h=(H[i]+22)*eo(s); bubs[i].style.top=(bottom-H[i])+'px'; bubs[i].style.opacity=cl(s*2); bubs[i].style.transform=`translateY(${(1-eo(s))*40}px) scale(${lerp(.92,1,eo(s))})`; bottom-=h;}
}

const T_END=21;
window.render=function(t){
  // S1 hook 0-3
  if(vis('s1',t,0,3.05,.01,.22)){layoutChat(t);
    const v=eo(p(t,1.55,1.85)); $('hookveil').style.opacity=v*.94; $('chat').style.filter=`blur(${v*6}px)`;
    const h=p(t,1.62,2.0); $('hookline').style.opacity=h; $('hookline').style.transform=`translateY(${(1-eo(h))*30}px)`;}
  // S2 reveal 3-6
  if(vis('s2',t,3.0,6.05,.3,.22)){const x=eo(p(t,3,6)); camF($('c2'),lerp(1.1,1.0,x),960,lerp(560,600,x),960,540);}
  // S3 earn 6-10
  if(vis('s3',t,6.0,10.05,.25,.22)){
    const A=[1,960,600],B=[1.8,706,575,1150,520]; lerpCam($('c3'),A,B,eio(p(t,6.3,7.3)));
    // cursor
    const cx=p(t,7.35,8.0), e=eio(cx); const x=lerp(1560,1150,e), y=lerp(1000,708,e);
    const press=t>8.05&&t<8.2?.85:1;
    const cu=$('cursor'); cu.style.opacity=cl(p(t,7.3,7.45))*(1-p(t,9.2,9.4)); cu.style.transform=`translate(${x}px,${y}px) scale(${press})`;
    const rg=p(t,8.05,8.55); const r=$('ring'); r.style.opacity=rg>0&&rg<1?1-rg:0; r.style.transform=`translate(${1150-45}px,${708-45}px) scale(${lerp(.4,1.6,eo(rg))})`;
    // badge
    const bd=$('badge'); const bx=p(t,6.9,7.35); bd.style.opacity=cl(bx*2); bd.style.transform=`translateY(${(1-back(bx))*-60}px)`;
    // chip flight
    const f=p(t,8.15,8.9), fe=eio(f); const ch=$('chip');
    ch.style.opacity=f>0&&t<8.98?1:0;
    const cxp=lerp(1080,1640,fe), cyp=lerp(640,120,fe)-Math.sin(f*Math.PI)*120;
    ch.style.transform=`translate(${cxp}px,${cyp}px) scale(${lerp(1,.6,fe)})`;
    const n=Math.round(12*eo(p(t,8.9,9.35))); $('bn').textContent=n;
    const bump=p(t,8.9,9.2); if(bump>0&&bump<1) bd.style.transform=`scale(${1+Math.sin(bump*Math.PI)*.08})`;
    const c=p(t,6.4,6.8); $('cap3').style.opacity=c; $('cap3').style.transform=`translateY(${(1-eo(c))*40}px)`;
  }
  // S4 spend 10-14
  if(vis('s4',t,10.0,14.05,.25,.22)){
    lerpCam($('c4a'),[1.2,820,400],[1.4,760,500],eo(p(t,10,12.2)));
    const sl=eio(p(t,11.9,12.45));
    $('c4a').style.opacity=1; $('c4a').style.left=(-sl*1920)+'px';
    lerpCam($('c4b'),[1.35,700,700,960,470],[1.5,640,720,960,470],eo(p(t,12,14)));
    $('c4b').style.left=((1-sl)*1920)+'px';
    const c=p(t,10.3,10.7); $('cap4').style.opacity=c; $('cap4').style.transform=`translateY(${(1-eo(c))*40}px)`;
  }
  // S5 community 14-17.5
  if(vis('s5',t,14.0,17.55,.25,.22)){
    lerpCam($('c5'),[1.2,680,420,760,470],[1.2,680,700,760,470],eio(p(t,14,17.5)));
    pop($('m5'),t,14.5,.5); $('m5').style.transform+=` rotate(${Math.sin(t*3)*2}deg)`;
    const c=p(t,14.3,14.7); $('cap5').style.opacity=c; $('cap5').style.transform=`translateY(${(1-eo(c))*40}px)`;
  }
  // Outro 17.5-21
  if(vis('outro',t,17.5,21.5,.3,.01)){
    const z=eo(p(t,17.5,21)); $('outbg').style.transform=`scale(${lerp(1.08,1,z)})`;
    pop($('omas'),t,17.7,.5); $('omas').style.transform+=` translateY(${Math.sin(t*4)*6}px)`;
    const l=p(t,17.95,18.35); $('ologo').style.opacity=l; $('ologo').style.transform=`translateY(${(1-eo(l))*20}px)`;
    const g=p(t,18.15,18.6); $('otag').style.opacity=g; $('otag').style.transform=`translateY(${(1-eo(g))*30}px)`;
    const s=p(t,18.6,19.0); $('osub').style.opacity=s;
  }
};
window.ready=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>i.onload=r))]);
</script>
</body></html>
